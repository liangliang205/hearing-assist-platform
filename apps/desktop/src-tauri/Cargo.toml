[package]
name = "hearlink-desktop"
version = "0.1.0"
description = "HearLink 桌面端（Tauri 外壳 + 系统级音频引擎 sidecar）"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "hearlink-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
