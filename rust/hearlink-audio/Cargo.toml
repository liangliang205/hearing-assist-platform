[package]
name = "hearlink-audio"
version = "0.1.0"
edition = "2021"
description = "HearLink 音频引擎：双耳增益补偿 + 实时链路（spike）"

[[bin]]
name = "hearlink-audio"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-queue = "0.3"
hound = "3.5"
rustfft = "6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
